<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        /* Центрируем карточку и задаем фон */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 2rem 0; /* Отступы сверху и снизу для мобильных */
        }

        /* Сама карточка */
        .register-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 420px; /* Чуть шире, так как полей больше */
            box-sizing: border-box;
        }

        h2 { 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 1.5rem; 
            color: #333; 
        }

        /* Стилизация полей */
        form p { 
            margin-bottom: 1rem; 
            text-align: left;
        }
        
        form label {
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }

        input { 
            width: 100%; 
            padding: 0.75rem; 
            margin-top: 0.4rem; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 0 3px rgba(40,167,69,0.1);
        }

        /* Подсказки под полями (например, требования к паролю) */
        .helptext { 
            font-size: 0.8rem; 
            color: #888; 
            display: block; 
            margin-top: 0.3rem; 
            line-height: 1.3;
        }

        /* Ошибки у конкретных полей */
        .errorlist { 
            color: #dc3545; 
            font-size: 0.85rem; 
            padding-left: 0; 
            list-style-type: none; 
            margin-top: 0.3rem;
            margin-bottom: 0;
        }

        /* Кнопка */
        button { 
            width: 100%; 
            padding: 0.8rem; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        button:hover { 
            background: #218838; 
        }

        /* Общая ошибка формы */
        .error-msg {
            color: #dc3545; 
            text-align: center; 
            margin-bottom: 1rem; 
            font-size: 0.9rem;
            background: #f8d7da;
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
        }

        /* Ссылки внизу */
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .footer-links a {
            color: #28a745;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Создать аккаунт</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="error-msg">
                    Пожалуйста, исправьте ошибки ниже.
                </div>
            {% endif %}

            {{ form.as_p }}
            
            <button type="submit">Зарегистрироваться</button>
        </form>

        <div class="footer-links">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </div>
    </div>

</body>
</html>
