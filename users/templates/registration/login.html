<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        /* Делаем фон страницы светло-серым и центрируем карточку */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        /* Сама рамка (карточка) */
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* Мягкая тень */
            width: 100%; 
            max-width: 400px; 
            box-sizing: border-box;
        }

        h2 { 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 1.5rem; 
            color: #333; 
        }

        /* Стилизация полей ввода */
        form p { 
            margin-bottom: 1rem; 
            text-align: left;
        }
        
        form label {
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }

        input { 
            width: 100%; 
            padding: 0.75rem; 
            margin-top: 0.4rem; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        /* Кнопка */
        button { 
            width: 100%; 
            padding: 0.8rem; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        button:hover { 
            background: #0056b3; 
        }

        /* Ссылки и текст внизу */
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .footer-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #dc3545; 
            text-align: center; 
            margin-bottom: 1rem; 
            font-size: 0.9rem;
            background: #f8d7da;
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <!-- Вот та самая рамка -->
    <div class="login-card">
        <h2>С возвращением!</h2>
        
        {% if form.errors %}
            <div class="error-msg">Неверный логин или пароль. Попробуйте ещё раз.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Войти</button>
        </form>
        
        <div class="footer-links">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </div>
    </div>

</body>
</html>
