{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: url("/media/static/images/fon.jpg") no-repeat center center fixed; background-size: cover; margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .result-card { background: #fff; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .btn { padding: 1rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .btn-search { background: #f8f9fa; border: 1px solid #ddd; color: #333; }
        .btn-search:hover { background: #e9ecef; }
        .btn-write { background: #28a745; color: white; border: 1px solid #28a745; }
        .btn-write:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="result-card">
        <div style="font-size: 4rem; margin-bottom: 1rem;">😕</div>
        <h2 style="color: #dc3545; margin-top: 0;">Этот автор скорее всего вам не подходит</h2>
        <p style="color: #666; line-height: 1.5;">Судя по вашим ответам, ваш запрос может не совпадать с профессиональным профилем этого автора. Рекомендуем выбрать другого специалиста.</p>
        
        <div class="btn-group">
            <a href="{% url 'creators_list' %}" class="btn btn-search">🔍 Искать дальше</a>
            <a href="{% url 'start_chat' author.id %}" class="btn btn-write">📩 Всё равно написать</a>
        </div>
    </div>
</body>
</html>
